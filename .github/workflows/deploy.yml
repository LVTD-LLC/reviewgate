name: Deploy Prod

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: reviewgate-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT_NAME: reviewgate
  CAPROVER_APP_NAME: reviewgate
  SMOKE_TEST_URL: https://reviewgate.lvtd.dev

jobs:
  build-and-deploy:
    name: Build and deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI head is latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$latest_sha" = "$EXPECTED_SHA"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image name and tags
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "release_version=$(date -u +%F).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          secrets: |
            posthog_key=${{ secrets.POSTHOG_PROJECT_API_KEY }}
          tags: |
            ${{ steps.image.outputs.image_name }}:latest
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.release_date }}
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.release_version }}
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.release_sha }}

      - name: Deploy site to CapRover
        uses: caprover/deploy-from-github@c221bd9d1c3a55de4c2b66c0dc4a3972d04c027c
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.release_sha }}

      - name: Smoke test deployed site
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl -fsS --max-time 10 "$SMOKE_TEST_URL" | grep -q "<title>ReviewGate"; then
              exit 0
            fi
            sleep 6
          done
          exit 1
