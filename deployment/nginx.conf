server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
