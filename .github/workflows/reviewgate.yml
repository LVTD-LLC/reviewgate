name: ReviewGate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      min_severity:
        description: Lowest severity published as ReviewGate finding comments.
        required: false
        default: P4

concurrency:
  group: reviewgate-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: read
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: read

jobs:
  reviewgate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Check OpenRouter secret
        id: openrouter
        shell: bash
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ReviewGate skipped: OPENROUTER_API_KEY secret is not configured."
          fi
      - name: Run ReviewGate
        if: steps.openrouter.outputs.configured == 'true'
        # ReviewGate reviews this repository with the stable v0 action so PRs
        # cannot change the reviewer implementation that scores the same PR.
        uses: LVTD-LLC/reviewgate@v0
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          config: .reviewgate.yml
          model: anthropic/claude-sonnet-4
          min_severity: ${{ inputs.min_severity || 'P4' }}
