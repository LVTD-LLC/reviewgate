name: ReviewGate
description: Open-source AI pre-merge checks for agent-written PRs
author: LVTD

branding:
  icon: shield
  color: blue

outputs:
  schema_version:
    description: Version of the agent result contract.
    value: ${{ steps.agent-result.outputs.schema_version }}
  status:
    description: "Review outcome: passed, needs_changes, or review_error."
    value: ${{ steps.agent-result.outputs.status }}
  score:
    description: Review score from 0 to 5, empty when review status is review_error.
    value: ${{ steps.agent-result.outputs.score }}
  reviewed_sha:
    description: Exact pull request head reviewed by ReviewGate.
    value: ${{ steps.agent-result.outputs.reviewed_sha }}
  result_path:
    description: Path to the versioned JSON agent result.
    value: ${{ steps.agent-result.outputs.result_path }}

inputs:
  mode:
    description: Run a pull request review or handle a maintainer rereview command.
    required: false
    default: review
  openrouter_api_key:
    description: OpenRouter API key used for model-backed review stages.
    required: false
  review_workflow:
    description: Workflow file name whose eligible pull_request run is rerun in rereview mode.
    required: false
    default: reviewgate.yml
  config:
    description: Path to ReviewGate config with severity, optional blocker verification, semantic context, and review angles.
    required: false
    default: .reviewgate.yml
  model:
    description: Exact OpenRouter model id. Defaults to ReviewGate's built-in model.
    required: false
    default: ""
  verify_blockers:
    description: "Run one independent blocker-verification model call when blockers are found. Use true or false; empty defers to .reviewgate.yml."
    required: false
    default: ""
  verifier_model:
    description: Trusted workflow-selected OpenRouter model id for blocker verification. Defaults to the primary review model and does not enable verification by itself.
    required: false
    default: ""
  min_severity:
    description: Lowest severity published as PR comments. One of P0, P1, P2, P3, P4.
    required: false
    default: P4
  angle_timeout_seconds:
    description: Maximum runtime for one model review angle.
    required: false
    default: "180"
  total_timeout_seconds:
    description: Maximum combined runtime for all model review angles.
    required: false
    default: "480"

runs:
  using: composite
  steps:
    - name: Validate ReviewGate inputs
      shell: bash
      env:
        REVIEWGATE_MODE: ${{ inputs.mode }}
        REVIEWGATE_VERIFY_BLOCKERS: ${{ inputs.verify_blockers }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
      run: |
        set -euo pipefail
        if [ "$REVIEWGATE_MODE" != "review" ] && [ "$REVIEWGATE_MODE" != "rereview" ]; then
          echo "::error title=Invalid ReviewGate mode::Use mode review or rereview." >&2
          exit 1
        fi
        if [ "$REVIEWGATE_MODE" = "review" ] && [ -z "${OPENROUTER_API_KEY:-}" ]; then
          echo "::error title=Missing OPENROUTER_API_KEY::Pass the openrouter_api_key input and configure the OPENROUTER_API_KEY repository secret." >&2
          exit 1
        fi
        normalized_verify_blockers="${REVIEWGATE_VERIFY_BLOCKERS,,}"
        if [ -n "$REVIEWGATE_VERIFY_BLOCKERS" ] \
          && [ "$normalized_verify_blockers" != "true" ] \
          && [ "$normalized_verify_blockers" != "false" ]; then
          echo "::error title=Invalid blocker verifier setting::Use verify_blockers true or false, or leave it empty to use .reviewgate.yml." >&2
          exit 1
        fi

    - name: Install verified ReviewGate runtime
      id: runtime
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_RUNTIME_VERSION: v0.9.2
      run: |
        set -euo pipefail
        started_ms="$(date +%s%3N)"
        if [ "${RUNNER_OS:-}" != "Linux" ] || [ "${RUNNER_ARCH:-}" != "X64" ]; then
          echo "::error title=Unsupported ReviewGate runner::ReviewGate supports Linux X64 runners." >&2
          exit 1
        fi

        runtime_dir="$RUNNER_TEMP/reviewgate-$REVIEWGATE_RUNTIME_VERSION"
        archive="$runtime_dir/reviewgate-x86_64-unknown-linux-gnu.tar.gz"
        mkdir -p "$runtime_dir"
        gh release download "$REVIEWGATE_RUNTIME_VERSION" \
          --repo LVTD-LLC/reviewgate \
          --pattern "$(basename "$archive")" \
          --dir "$runtime_dir" \
          --clobber
        gh attestation verify "$archive" \
          --repo LVTD-LLC/reviewgate \
          --signer-workflow LVTD-LLC/reviewgate/.github/workflows/release-runtime.yml \
          --source-ref "refs/tags/$REVIEWGATE_RUNTIME_VERSION" \
          --deny-self-hosted-runners
        tar -xzf "$archive" -C "$runtime_dir"
        binary="$runtime_dir/reviewgate"
        chmod +x "$binary"
        "$binary" --help >/dev/null

        queue_ms=""
        run_times="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --jq '[.created_at, .run_started_at] | @tsv' 2>/dev/null || true)"
        if [ -n "$run_times" ]; then
          IFS=$'\t' read -r created_at run_started_at <<< "$run_times"
          created_ms=""
          run_started_ms=""
          if [ -n "$created_at" ] && [ -n "$run_started_at" ]; then
            created_ms="$(date -d "$created_at" +%s%3N 2>/dev/null || true)"
            run_started_ms="$(date -d "$run_started_at" +%s%3N 2>/dev/null || true)"
          fi
          if [ -n "$created_ms" ] && [ -n "$run_started_ms" ] \
            && [ "$run_started_ms" -ge "$created_ms" ]; then
            queue_ms=$((run_started_ms - created_ms))
          fi
        fi

        echo "binary=$binary" >> "$GITHUB_OUTPUT"
        echo "queue_ms=$queue_ms" >> "$GITHUB_OUTPUT"
        echo "startup_ms=$(( $(date +%s%3N) - started_ms ))" >> "$GITHUB_OUTPUT"

    - name: Request ReviewGate rereview
      if: ${{ inputs.mode == 'rereview' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_WORKFLOW: ${{ inputs.review_workflow }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        "$REVIEWGATE_BIN" request-rereview \
          --repo "$GITHUB_WORKSPACE" \
          --workflow "$REVIEWGATE_WORKFLOW"

    - name: Publish ReviewGate start signal
      if: ${{ inputs.mode == 'review' }}
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        "$REVIEWGATE_BIN" publish-start-signal \
          --repo "$GITHUB_WORKSPACE"

    - name: Run ReviewGate
      id: review
      if: ${{ inputs.mode == 'review' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        REVIEWGATE_CONFIG: ${{ inputs.config }}
        REVIEWGATE_MODEL: ${{ inputs.model }}
        REVIEWGATE_VERIFY_BLOCKERS: ${{ inputs.verify_blockers }}
        REVIEWGATE_VERIFIER_MODEL: ${{ inputs.verifier_model }}
        REVIEWGATE_MIN_SEVERITY: ${{ inputs.min_severity }}
        REVIEWGATE_ANGLE_TIMEOUT_SECONDS: ${{ inputs.angle_timeout_seconds }}
        REVIEWGATE_TOTAL_TIMEOUT_SECONDS: ${{ inputs.total_timeout_seconds }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        started_ms="$(date +%s%3N)"
        args=(
          review-pr
          --repo "$GITHUB_WORKSPACE"
          --config "$REVIEWGATE_CONFIG"
          --json-out "$GITHUB_WORKSPACE/.reviewgate/review.json"
          --summary-out "$GITHUB_WORKSPACE/.reviewgate/summary.md"
          --min-severity "$REVIEWGATE_MIN_SEVERITY"
          --angle-timeout-seconds "$REVIEWGATE_ANGLE_TIMEOUT_SECONDS"
          --total-timeout-seconds "$REVIEWGATE_TOTAL_TIMEOUT_SECONDS"
        )
        if [ -n "$REVIEWGATE_MODEL" ]; then
          args+=(--model "$REVIEWGATE_MODEL")
        fi
        if [ -n "$REVIEWGATE_VERIFY_BLOCKERS" ]; then
          args+=(--verify-blockers "$REVIEWGATE_VERIFY_BLOCKERS")
        fi
        if [ -n "$REVIEWGATE_VERIFIER_MODEL" ]; then
          args+=(--verifier-model "$REVIEWGATE_VERIFIER_MODEL")
        fi
        "$REVIEWGATE_BIN" "${args[@]}"
        echo "model_ms=$(( $(date +%s%3N) - started_ms ))" >> "$GITHUB_OUTPUT"

    - name: Publish ReviewGate findings
      id: findings
      if: ${{ inputs.mode == 'review' }}
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_MIN_SEVERITY: ${{ inputs.min_severity }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        started_ms="$(date +%s%3N)"
        publish_status=0
        "$REVIEWGATE_BIN" publish-findings \
          --repo "$GITHUB_WORKSPACE" \
          --input "$GITHUB_WORKSPACE/.reviewgate/review.json" \
          --min-severity "$REVIEWGATE_MIN_SEVERITY" || publish_status=$?
        echo "publish_ms=$(( $(date +%s%3N) - started_ms ))" >> "$GITHUB_OUTPUT"
        exit "$publish_status"

    - name: Record ReviewGate timings
      if: ${{ inputs.mode == 'review' }}
      shell: bash
      continue-on-error: true
      env:
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
        REVIEWGATE_QUEUE_MS: ${{ steps.runtime.outputs.queue_ms }}
      run: |
        set -euo pipefail
        args=(
          record-timings
          --input "$GITHUB_WORKSPACE/.reviewgate/review.json"
          --startup-ms "${{ steps.runtime.outputs.startup_ms }}"
          --model-ms "${{ steps.review.outputs.model_ms }}"
          --publish-ms "${{ steps.findings.outputs.publish_ms }}"
        )
        if [ -n "$REVIEWGATE_QUEUE_MS" ]; then
          args+=(--queue-ms "$REVIEWGATE_QUEUE_MS")
        fi
        "$REVIEWGATE_BIN" "${args[@]}"

    - name: Publish ReviewGate summary
      id: summary
      if: ${{ inputs.mode == 'review' && always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_MIN_SEVERITY: ${{ inputs.min_severity }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ ! -f "$GITHUB_WORKSPACE/.reviewgate/review.json" ]; then
          echo "::error title=ReviewGate summary missing::ReviewGate did not produce $GITHUB_WORKSPACE/.reviewgate/review.json." >&2
          exit 1
        fi

        if ! "$REVIEWGATE_BIN" publish-summary \
          --repo "$GITHUB_WORKSPACE" \
          --input "$GITHUB_WORKSPACE/.reviewgate/review.json" \
          --summary-out "$GITHUB_WORKSPACE/.reviewgate/summary.md" \
          --min-severity "$REVIEWGATE_MIN_SEVERITY"; then
          echo "::error title=ReviewGate summary publish failed::Could not publish the canonical ReviewGate summary comment. Check pull-request/issues permissions and the GitHub API error above." >&2
          exit 1
        fi

    - name: Publish ReviewGate check run
      if: ${{ inputs.mode == 'review' && always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        "$REVIEWGATE_BIN" publish-check-run \
          --repo "$GITHUB_WORKSPACE" \
          --input "$GITHUB_WORKSPACE/.reviewgate/review.json"

    - name: Reconcile ReviewGate finding threads
      if: ${{ inputs.mode == 'review' && always() && steps.summary.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        if ! "$REVIEWGATE_BIN" reconcile-threads \
          --repo "$GITHUB_WORKSPACE" \
          --input "$GITHUB_WORKSPACE/.reviewgate/review.json"; then
          echo "::error title=ReviewGate thread reconciliation incomplete::The review output was published, but one or more finding-thread updates failed. Rerun ReviewGate; reconciliation is idempotent and resumes from GitHub's observed state." >&2
          exit 1
        fi

    - name: Publish ReviewGate agent result
      id: agent-result
      if: ${{ inputs.mode == 'review' && always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEWGATE_BIN: ${{ steps.runtime.outputs.binary }}
      run: |
        set -euo pipefail
        "$REVIEWGATE_BIN" publish-agent-result \
          --repo "$GITHUB_WORKSPACE" \
          --input "$GITHUB_WORKSPACE/.reviewgate/review.json" \
          --output "$GITHUB_WORKSPACE/.reviewgate/result.json"

    - name: Upload ReviewGate agent result
      if: ${{ inputs.mode == 'review' && always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: reviewgate-agent-result-${{ steps.agent-result.outputs.reviewed_sha }}-attempt-${{ github.run_attempt }}
        path: ${{ github.workspace }}/.reviewgate/result.json
        if-no-files-found: error
        retention-days: 14
